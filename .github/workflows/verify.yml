name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: public-ci/full-suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Chromium
        run: |
          npm --prefix services/web ci --prefer-offline --no-audit --no-fund
          npm --prefix services/web exec -- playwright install --with-deps chromium

      - name: Run the public gate
        run: bash scripts/public_ci.sh
