name: Feature request
description: Suggest a Dispatch product improvement without private account data.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: job
    attributes:
      label: User job
      description: Describe the job and why the current product does not complete it.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result, not only a proposed interface.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Mail list
        - Reader
        - Drafts and sending
        - Codex
        - Native macOS app
        - Updates and installation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include private email, message bodies, OAuth data, tokens, account IDs, or unredacted logs.
          required: true
