<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Dispatch</title>
  <desc id="desc">Three forward chevrons in glowing volt green on a full-bleed ink tile, with a four-point spark. The OS applies the icon mask.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1C1F26"/><stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>
    <linearGradient id="volt" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F2FF7A"/><stop offset="1" stop-color="#B9F000"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="190%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000000" flood-opacity=".55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#tile)"/>
  <path d="M610 300l210 212-210 212" fill="none" stroke="#C8F51A" stroke-width="120" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity=".55"/>
  <g fill="none" stroke="url(#volt)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M250 300l210 212-210 212" opacity=".35"/>
    <path d="M430 300l210 212-210 212" opacity=".65"/>
    <path d="M610 300l210 212-210 212"/>
  </g>
  <path transform="translate(795 255) scale(.75)" d="M0-100C6-40 40-6 100 0 40 6 6 40 0 100-6 40-40 6-100 0-40-6-6-40 0-100z" fill="url(#volt)"/>
</svg>
